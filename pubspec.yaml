name: cashit
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.0.0
  cloud_firestore: ^6.0.0
  firebase_auth: ^6.0.1
  firebase_storage: ^13.0.0
  google_sign_in: ^7.2.0
  fluttertoast: ^9.0.0
  http: ^1.5.0
  flutter_stripe: ^12.0.2
  url_launcher: ^6.3.2
  flutter_stripe_web: ^7.0.0
  app_links: ^6.4.1
  flutter_svg: ^2.2.1
  font_awesome_flutter: ^10.12.0
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg
    - assets/mail.svg
    - assets/lock.svg
    - assets/image.svg 
    - assets/image.png
    - assets/IdentificationCard.svg
